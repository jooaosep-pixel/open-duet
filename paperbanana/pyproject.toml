[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbanana"
version = "0.1.0"
description = "Reference-driven multi-agent pipeline that turns method text and captions into academic illustrations and plots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "google-genai>=1.0",
    "openai>=1.60",
    "gradio>=5.0",
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
paperbanana = "paperbanana.cli:main"

[tool.setuptools.packages.find]
include = ["paperbanana*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
